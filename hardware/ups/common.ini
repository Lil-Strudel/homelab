[NetworkTCP/IP]
DomainName=lilstrudel.io
IPv6=disabled

[NetworkDNS]
PrimaryDNSServerIP=10.69.100.1
SecondaryDNSServerIP=0.0.0.0
DNSManualOverride=enabled

[NetworkFTPServer]
Access=disabled

[NetworkTelnet]
Telnet=disabled
SSH=enabled

[NetworkWeb]
HTTP=disabled
HTTPS=enabled
MinimumProtocol=TLS1.2

[NetworkBACnet]
Access=disabled

[NetworkSNMP]
Access=disabled
AccessSnmpIII=enabled
UserProfile1Name=${SNMP_USERNAME}
UserProfile1AccessType=authPriv
UserProfile1AuthProtocol=SHA1
UserProfile1EncryptProtocol=AES
UserProfile1AuthPhrase=${SNMP_AUTH_PHRASE}
UserProfile1EncryptPhrase=${SNMP_PRIV_PHRASE}
AccessControlSnmpIII1Enabled=enabled
AccessControlSnmpIII1Mapping=0
AccessControlSnmpIII1Address=10.69.60.255
AccessControlSnmpIII2Enabled=enabled
AccessControlSnmpIII2Mapping=0
AccessControlSnmpIII2Address=10.69.100.255

[NetworkSYSLOG]
Syslog=enabled
Facility=User
Server1=10.69.65.43
Port1=514
Protocol1=0

[SystemUserManager]
DefaultUserBadLoginAttempts=5

[SystemDate/Time]
NTPEnable=enabled
NTPManualOverride=enabled
NTPPrimaryServer=10.69.100.1
NTPSecondaryServer=0.0.0.0
NTPTimeZone=00:00
DSTConfiguration=Disabled

[CEIP]
Tracking=disabled

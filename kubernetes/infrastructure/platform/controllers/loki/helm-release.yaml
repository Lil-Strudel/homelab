apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: s3
        bucketNames:
          chunks: ${BUCKET_NAME}
          ruler: ${BUCKET_NAME}
        s3:
          endpoint: ${BUCKET_HOST}:${BUCKET_PORT}
          accessKeyId: ${AWS_ACCESS_KEY_ID}
          secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true # the RGW gateway is a ClusterIP speaking plain HTTP
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 168h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: s3
      ingester:
        chunk_encoding: snappy

    singleBinary:
      replicas: 1
      extraArgs:
        - -config.expand-env=true # the S3 config is ${...} placeholders filled from the OBC
      extraEnvFrom:
        - configMapRef:
            name: loki-bucket
        - secretRef:
            name: loki-bucket
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 10Gi
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi

    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0

    gateway:
      replicas: 1
      verboseLogging: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    lokiCanary:
      enabled: false
    test:
      enabled: false

apiVersion: v1
kind: ConfigMap
metadata:
  name: ddns-script
  namespace: ddns
data:
  ddns.sh: |
    #!/bin/sh
    # Upsert every configured Route53 A record to the cluster's current egress address,
    # which is the WAN address the ISP has handed the router.
    set -u

    CHECKIP_URL="${CHECKIP_URL:-https://checkip.amazonaws.com}"
    RECORDS_FILE="${RECORDS_FILE:-/config/records}"
    RECORD_TTL="${RECORD_TTL:-300}"

    log() { echo "$@"; }

    wan_ip=$(curl -fsS --max-time 10 --retry 3 --retry-delay 2 "$CHECKIP_URL" 2>/dev/null | tr -d '[:space:]')
    if ! echo "$wan_ip" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
      log "level=error event=ddns_wan_lookup_failed url=$CHECKIP_URL"
      exit 1
    fi
    log "level=info event=ddns_wan_resolved ip=$wan_ip"

    zone_id_for() {
      _zone="$1"
      _cache="/tmp/zone-$(echo "$_zone" | tr -c 'a-zA-Z0-9.-' '_')"
      if [ -s "$_cache" ]; then
        cat "$_cache"
        return 0
      fi
      _id=$(aws route53 list-hosted-zones-by-name --dns-name "$_zone" --max-items 1 \
        --query "HostedZones[?Name=='${_zone}.'].Id" --output text 2>/dev/null |
        sed 's#^/hostedzone/##')
      if [ -z "$_id" ] || [ "$_id" = "None" ]; then
        return 1
      fi
      printf '%s' "$_id" >"$_cache"
      printf '%s' "$_id"
    }

    updated=0
    unchanged=0
    failed=0

    while read -r fqdn zone _rest; do
      case "$fqdn" in
      '' | \#*) continue ;;
      esac
      if [ -z "$zone" ]; then
        log "level=error event=ddns_record_malformed record=$fqdn"
        failed=$((failed + 1))
        continue
      fi

      zone_id=$(zone_id_for "$zone") || {
        log "level=error event=ddns_zone_lookup_failed record=$fqdn zone=$zone"
        failed=$((failed + 1))
        continue
      }

      current=$(aws route53 list-resource-record-sets --hosted-zone-id "$zone_id" \
        --start-record-name "${fqdn}." --start-record-type A --max-items 1 \
        --query "ResourceRecordSets[?Name=='${fqdn}.' && Type=='A'].ResourceRecords[0].Value" \
        --output text 2>/dev/null)
      if [ "$current" = "None" ]; then current=""; fi

      if [ "$current" = "$wan_ip" ]; then
        unchanged=$((unchanged + 1))
        log "level=info event=ddns_record_unchanged record=$fqdn zone=$zone ip=$wan_ip"
        continue
      fi

      cat >/tmp/change-batch.json <<EOF
    {
      "Comment": "ddns cronjob",
      "Changes": [
        {
          "Action": "UPSERT",
          "ResourceRecordSet": {
            "Name": "${fqdn}.",
            "Type": "A",
            "TTL": ${RECORD_TTL},
            "ResourceRecords": [{ "Value": "${wan_ip}" }]
          }
        }
      ]
    }
    EOF

      if aws route53 change-resource-record-sets --hosted-zone-id "$zone_id" \
        --change-batch file:///tmp/change-batch.json >/dev/null; then
        updated=$((updated + 1))
        log "level=info event=ddns_record_updated record=$fqdn zone=$zone old=${current:-none} new=$wan_ip"
      else
        failed=$((failed + 1))
        log "level=error event=ddns_record_update_failed record=$fqdn zone=$zone old=${current:-none} new=$wan_ip"
      fi
    done <"$RECORDS_FILE"

    log "level=info event=ddns_run_complete ip=$wan_ip updated=$updated unchanged=$unchanged failed=$failed"
    [ "$failed" -eq 0 ]

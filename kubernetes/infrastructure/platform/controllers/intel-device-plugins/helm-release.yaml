apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: intel-device-plugins
spec:
  interval: 1h
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: "0.37.1"
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: intel-device-plugins
      interval: 1h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    manager:
      devices:
        gpu: true # with no devices listed, every controller runs, including an SGX webhook that mutates every pod in the cluster

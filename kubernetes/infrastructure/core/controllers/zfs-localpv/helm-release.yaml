apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zfs-localpv
  namespace: openebs
spec:
  interval: 1h
  chart:
    spec:
      chart: zfs-localpv
      version: "2.11.2"
      sourceRef:
        kind: HelmRepository
        name: zfs-localpv
        namespace: openebs
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    analytics:
      enabled: false
    zfs:
      bin: /usr/local/sbin/zfs # Talos system extensions install under /usr/local
    zfsNode:
      encrKeysDir: /var/openebs/keys # the chart default under /home is read-only on Talos
      nodeSelector:
        kubernetes.io/hostname: rem-4

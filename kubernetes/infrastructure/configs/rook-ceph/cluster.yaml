apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-cluster
  namespace: rook-ceph
spec:
  interval: 1h
  chart:
    spec:
      chart: rook-ceph-cluster
      version: "v1.20.3"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: rook-ceph
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: -1
  values:
    cephImage:
      tag: v20.2.3
    toolbox:
      enabled: true
    cephClusterSpec:
      dashboard:
        enabled: true
      placement:
        all:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
      storage:
        useAllNodes: true
        useAllDevices: false
        deviceFilter: "^nvme0n1"
    cephObjectStores: []

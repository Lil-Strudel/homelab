apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-mgr-lb
  namespace: rook-ceph
  labels:
    app: rook-ceph-mgr
    rook_cluster: rook-ceph
  annotations:
    lbipam.cilium.io/ips: "10.69.60.64"
spec:
  type: LoadBalancer
  selector:
    app: rook-ceph-mgr
    rook_cluster: rook-ceph
    mgr_role: active
  ports:
    - name: dashboard
      port: 8443
      protocol: TCP
      targetPort: 8443
  sessionAffinity: None

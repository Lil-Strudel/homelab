# Chart sources for the Rook-Ceph stack.
#
#   rook-release       → the rook-ceph operator + rook-ceph-cluster charts
#   ceph-csi-operator  → the ceph-csi-drivers chart (new hard requirement in
#                        Rook v1.20; the operator no longer bundles the drivers)
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rook-release
  namespace: rook-ceph
spec:
  interval: 6h
  url: https://charts.rook.io/release
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ceph-csi-operator
  namespace: rook-ceph
spec:
  interval: 6h
  url: https://ceph.github.io/ceph-csi-operator

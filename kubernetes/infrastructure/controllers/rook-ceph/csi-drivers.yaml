# Ceph-CSI drivers (chart `ceph-csi-drivers`, from the ceph-csi-operator repo).
#
# New in Rook v1.20: the operator no longer deploys the CSI drivers. This chart
# creates the `Driver` CRs that the ceph-csi-operator (installed by the operator
# chart) reconciles into the RBD/CephFS provisioners. WITHOUT this release,
# volume provisioning fails — the StorageClasses in cluster.yaml would have no
# driver behind them.
#
# `dependsOn` the operator so the ceph-csi-operator CRDs exist before we create
# Driver CRs. Values are the Rook-compatible recommended set: the driver names
# MUST be `<operator-namespace>.{rbd,cephfs}.csi.ceph.com` (i.e. rook-ceph.*) to
# match the provisioner names the rook-ceph-cluster chart bakes into the
# StorageClasses. Node plugins run on the host network by default, which is what
# we want on Talos + Cilium (no in-pod route to the mons otherwise).
#
# Chart version tracks the ceph-csi-operator subchart pinned by the rook-ceph
# chart (v1.20.1 → ceph-csi-operator 1.0.1); keep them in sync on a Rook bump.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
  namespace: rook-ceph
spec:
  interval: 1h
  dependsOn:
    - name: ceph-operator
  chart:
    spec:
      chart: ceph-csi-drivers
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
        namespace: rook-ceph
      interval: 1h
  values:
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
      # No S3/object store and no NFS export on this cluster.
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com

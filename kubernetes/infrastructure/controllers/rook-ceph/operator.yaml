# Rook-Ceph operator (chart `rook-ceph`). Installs the operator + the bundled
# ceph-csi-operator subchart + all CRDs. Reconciled in the `infra-controllers`
# stage with `wait: true`, so it is fully healthy before the CephCluster
# (configs/rook-ceph/cluster.yaml) and the CSI drivers reconcile.
#
# As of Rook v1.20 the operator NO LONGER deploys the CSI drivers itself — the
# drivers are admin-managed via the ceph-csi-operator and configured by a
# separate `ceph-csi-drivers` HelmRelease (see csi-drivers.yaml). Keep the chart
# version here in sync with cluster.yaml.
#
# Values are an intentional, minimal override set: only what we deliberately
# pin lives here — everything else is left at the chart default on purpose.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-operator
  namespace: rook-ceph
spec:
  interval: 1h
  chart:
    spec:
      chart: rook-ceph
      version: "1.20.1"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: rook-ceph
      interval: 1h
  values:
    # LOAD-BEARING: the chart owns the CRDs. Never flip this to false on a live
    # cluster — dropping the CRDs deletes the CephCluster and destroys data.
    # Matches the chart default; pinned so a chart bump can't silently change it.
    crds:
      enabled: true

    csi:
      # LOAD-BEARING: install the ceph-csi-operator subchart. Required by the
      # v1.20 CSI model — without it the ceph-csi-drivers chart has no operator
      # to reconcile the Driver CRs. Chart default is true; pinned deliberately.
      installCsiOperator: true

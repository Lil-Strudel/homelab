apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: victoria-metrics
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.90.2"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: victoria-metrics
      interval: 1h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace # the chart ships its CRDs in Helm's crds/ dir, which Helm alone would never update on upgrade
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    fullnameOverride: vm # the operator prefixes its own resources (vmsingle-, vmagent-); a short base keeps them clear of the 63-char name limit

    victoria-metrics-operator:
      enabled: true

    vmsingle:
      spec:
        retentionPeriod: 7d
        replicaCount: 1
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-block
          resources:
            requests:
              storage: 30Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        serviceSpec:
          useAsDefault: true
          metadata:
            annotations:
              lbipam.cilium.io/ips: "10.69.65.42"
          spec:
            type: LoadBalancer

    vmagent:
      spec:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

    grafana:
      enabled: false

    alertmanager:
      enabled: false

    vmalert:
      enabled: false

    defaultRules:
      create: false

    kubeProxy:
      enabled: false # Cilium is the kube-proxy replacement — there is nothing to scrape

    kubeControllerManager:
      enabled: false # Talos binds it to localhost, unreachable from a scrape pod

    kubeScheduler:
      enabled: false # Talos binds it to localhost, unreachable from a scrape pod

    kubeEtcd:
      enabled: false # Talos etcd requires client certs the scrape pod does not hold

    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 128Mi

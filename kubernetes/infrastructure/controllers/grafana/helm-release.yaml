apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: grafana
      version: "12.10.4"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: grafana
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    persistence:
      enabled: true
      type: pvc
      storageClassName: ceph-block
      size: 10Gi

    service:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "10.69.65.40"

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL # the victoria-metrics-k8s-stack writes its dashboard ConfigMaps into its own namespace
      datasources:
        enabled: false

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: VictoriaMetrics # the victoria-metrics-k8s-stack dashboards are rewritten to this datasource uid
            type: prometheus
            access: proxy
            url: http://vmsingle-vm.victoria-metrics.svc:8428
            isDefault: true
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki-gateway.loki.svc

    grafana.ini:
      analytics:
        check_for_updates: false
        reporting_enabled: false
      users:
        allow_sign_up: false

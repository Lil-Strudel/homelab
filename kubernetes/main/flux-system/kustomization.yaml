apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Enable SOPS decryption on the root Flux Kustomization so any committed
# *.sops.yaml Secret is decrypted in-cluster via the `sops-age` secret.
# Applied as a patch here so it survives `flux bootstrap` regenerating gotk-sync.yaml.
patches:
- target:
    kind: Kustomization
    name: flux-system
  patch: |
    - op: add
      path: /spec/decryption
      value:
        provider: sops
        secretRef:
          name: sops-age

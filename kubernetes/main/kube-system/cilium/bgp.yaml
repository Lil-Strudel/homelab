# Cilium BGP control plane. Worker nodes (rem-1..3) peer with the MikroTik
# router (10.69.60.1) and advertise LoadBalancer service IPs. kube-vip owns the
# control-plane VIP over BGP from the control-plane nodes, so the two BGP speakers
# live on disjoint node sets and never collide. The router declares peers for all
# six nodes in terraform/main.tf (bgp_peers).
#
#   Cluster ASN 65000  <-->  Router ASN 65100
#
# Selecting workers (no control-plane role label) keeps service ingress on the
# worker nodes; kube-proxy replacement forwards to pods on any node.
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  bgpInstances:
    - name: instance-65000
      localASN: 65000
      peers:
        - name: mikrotik-router
          peerASN: 65100
          peerAddress: 10.69.60.1
          peerConfigRef:
            name: mikrotik-peer
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: mikrotik-peer
spec:
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: lb-services
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      # Advertise every LoadBalancer service. Label a Service
      # `bgp-advertise: "false"` to exclude it.
      selector:
        matchExpressions:
          - key: bgp-advertise
            operator: NotIn
            values: ["false"]

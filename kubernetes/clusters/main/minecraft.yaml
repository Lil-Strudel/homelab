apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 1h
  retryInterval: 2m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/minecraft
  prune: true
  wait: false # a cold modpack download outlasts any sane timeout; readiness is not a gate here
  decryption:
    provider: sops
    secretRef:
      name: sops-age

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hackathon-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-configs
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/hackathon/controllers
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hackathon-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: hackathon-controllers
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/hackathon/configs
  prune: true
  wait: false # the app Kustomization it creates stays not-Ready until CI publishes the first artifact
  decryption:
    provider: sops
    secretRef:
      name: sops-age

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dashy
  namespace: dashy
spec:
  endpointSelector: {}
  ingress:
    # `ingress` is the reserved identity Cilium gives its Envoy ingress proxy; `host` is
    # the kubelet running the /healthz probe.
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # Status checks run in the Dashy pod, not the browser, so every probed endpoint needs
    # a rule here. Ports are the backend container ports — service translation happens
    # before policy is evaluated, so the ClusterIP port never matches.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: grafana
            app.kubernetes.io/name: grafana
            app.kubernetes.io/instance: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoria-metrics
            app.kubernetes.io/name: vmsingle
            app.kubernetes.io/instance: vm
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: loki
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: alloy
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-syslog
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: rook-ceph
            app: rook-ceph-mgr
            mgr_role: active
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP

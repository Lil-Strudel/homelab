apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ovumcy-data
  namespace: ovumcy
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ovumcy-fence
  namespace: ovumcy
  labels:
    velero.io/exclude-from-backup: "true" # restoring the fence beside the database defeats restore detection
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

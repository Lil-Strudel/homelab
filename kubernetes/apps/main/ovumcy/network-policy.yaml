apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ovumcy
  namespace: ovumcy
spec:
  endpointSelector: {}
  ingress:
    # `ingress` is the reserved identity Cilium gives its Envoy ingress proxy; `host` is
    # the kubelet running the /healthz probe.
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

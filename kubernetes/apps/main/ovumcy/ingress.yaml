apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ovumcy
  namespace: ovumcy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.27"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - period.lilstrudel.io
      secretName: ovumcy-tls
  rules:
    - host: period.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ovumcy
                port:
                  number: 80

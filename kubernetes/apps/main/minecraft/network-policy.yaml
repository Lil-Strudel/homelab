apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minecraft
  namespace: minecraft
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - world
        - host
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The server jar is fetched from PaperMC on first start and after a VERSION bump, and
    # online-mode auth resolves every joining player against Mojang. Both drop away once
    # Velocity fronts the server and Paper moves to modern forwarding.
    - toFQDNs:
        - matchName: "api.papermc.io"
        - matchName: "fill.papermc.io"
        - matchName: "sessionserver.mojang.com"
        - matchName: "api.mojang.com"
        - matchName: "api.minecraftservices.com"
        - matchName: "textures.minecraft.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

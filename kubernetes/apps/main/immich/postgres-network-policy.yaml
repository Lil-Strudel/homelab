apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-postgres
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: immich-pg
  ingress:
    # Postgres from the app, and from the other instance for streaming replication.
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The instance manager's HTTP API: 8000 is the operator's status/liveness channel,
    # 9187 is the metrics endpoint.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
        - {}
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # vmagent scrapes 9187 from its own namespace, so the same-namespace `{}` above
    # cannot reach it. Metrics only — 8000 stays closed to everything but cnpg-system.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoria-metrics
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Every toFQDNs rule below depends on the DNS proxy seeing the lookup here.
          rules:
            dns:
              - matchPattern: "*"
    # The instance manager watches its own Cluster resource.
    - toEntities:
        - kube-apiserver
    # 8000 alongside 5432: the primary polls each peer's instance-manager API to decide
    # whether a failover is safe. Without it that check is denied and every switchover
    # falls back to "the API server is reachable", which cannot see the replica at all.
    - toEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # barman-cloud shipping WAL and base backups. Both the plain and dualstack spellings
    # must stay listed — Cilium's `*` never crosses a dot, so one does not cover the other.
    - toFQDNs:
        - matchName: "s3.us-west-2.amazonaws.com"
        - matchPattern: "*.s3.us-west-2.amazonaws.com"
        - matchName: "s3.dualstack.us-west-2.amazonaws.com"
        - matchPattern: "*.s3.dualstack.us-west-2.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

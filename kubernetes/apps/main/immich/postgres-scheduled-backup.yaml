apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-pg-daily
  namespace: immich
spec:
  schedule: "0 30 3 * * *" # six fields: CNPG uses the Go cron spec, which leads with seconds
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: immich-pg

apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio
  namespace: factorio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: factorio
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app: factorio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: factorio
          image: factoriotools/factorio:2.1.12-rootless # the non-rootless tag chowns as root at entrypoint
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: factorio
              containerPort: 34197
              protocol: UDP
            - name: rcon
              containerPort: 27015
          volumeMounts:
            - name: data
              mountPath: /factorio
          startupProbe:
            tcpSocket:
              port: rcon
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: rcon
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: rcon
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: factorio-data

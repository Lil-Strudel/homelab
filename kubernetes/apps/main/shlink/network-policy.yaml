apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: shlink
  namespace: shlink
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: shlink-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

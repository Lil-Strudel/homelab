apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink
  namespace: shlink
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shlink
  template:
    metadata:
      labels:
        app: shlink
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shlink
          image: shlinkio/shlink:5.1.5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEFAULT_DOMAIN
              value: 16e.link
            - name: IS_HTTPS_ENABLED
              value: "true"
            - name: TIMEZONE
              value: America/Denver
            - name: TRUSTED_PROXIES
              value: 10.244.0.0/16 # pod CIDR only — else anything in RFC1918 can spoof X-Forwarded-For
            - name: DB_DRIVER
              value: postgres
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: shlink-pg-app
                  key: host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: shlink-pg-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shlink-pg-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shlink-pg-app
                  key: password
            - name: INITIAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shlink
                  key: INITIAL_API_KEY
          startupProbe:
            httpGet:
              path: /rest/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /rest/health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /rest/health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

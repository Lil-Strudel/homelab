apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosquitto
  namespace: home-automation
spec:
  endpointSelector:
    matchLabels:
      app: mosquitto
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: [zigbee2mqtt, home-assistant]
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

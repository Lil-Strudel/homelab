apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zwave-js-ui
  namespace: home-automation
spec:
  endpointSelector:
    matchLabels:
      app: zwave-js-ui
  ingress:
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "8091"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: home-assistant
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # The toFQDNs rule below depends on the DNS proxy seeing the lookup here.
          rules:
            dns:
              - matchPattern: "*"
    - toCIDR:
        - 10.69.60.30/32
      toPorts:
        - ports:
            - port: "6639"
              protocol: TCP
    # Device config database updates (published to npm) and the firmware update service.
    - toFQDNs:
        - matchName: "registry.npmjs.org"
        - matchName: "firmware.zwave-js.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

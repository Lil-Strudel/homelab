apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwave-js-ui
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zwave-js-ui
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: store
      labels:
        app: zwave-js-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zwave-js-ui
          image: zwavejs/zwave-js-ui:11.25.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8091
            - name: ws
              containerPort: 3000
          env:
            - name: TZ
              value: America/Denver
            - name: ZWAVE_PORT
              value: tcp://10.69.60.30:6639
            - name: ZWAVE_EXTERNAL_SETTINGS
              value: /etc/zwave-js-ui/settings.json
            - name: TRUST_PROXY
              value: 10.244.0.0/16 # pod CIDR only — else anything in RFC1918 can spoof X-Forwarded-For
            - name: USE_SECURE_COOKIE
              value: "true"
          envFrom:
            - secretRef:
                name: zwave-js-ui
          volumeMounts:
            - name: store
              mountPath: /usr/src/app/store
            - name: settings
              mountPath: /etc/zwave-js-ui
          # TCP, not /health: that endpoint is rate-limited per client IP, and the kubelet's
          # probes alone would spend most of the hourly budget.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: zwave-js-ui-store
        - name: settings
          configMap:
            name: zwave-js-ui

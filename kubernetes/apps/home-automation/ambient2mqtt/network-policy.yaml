apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ambient2mqtt
  namespace: home-automation
spec:
  endpointSelector:
    matchLabels:
      app: ambient2mqtt
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # The toFQDNs rule below depends on the DNS proxy seeing the lookup here.
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app: mosquitto
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
    - toFQDNs:
        - matchName: "auth.prod.ambientproptech.com"
        - matchName: "device-discovery.prod.ambientproptech.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app: zigbee2mqtt
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt:2.14.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Denver
            - name: Z2M_ONBOARD_NO_SERVER
              value: "1" # with no configuration.yaml, write one from these env vars instead of serving the setup wizard
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
              value: tcp://10.69.60.30:6638
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER
              value: ember
            - name: ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL
              value: "25"
            - name: ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_OUTPUT
              value: '["console"]'
            - name: ZIGBEE2MQTT_CONFIG_MQTT_SERVER
              value: mqtt://mosquitto:1883
            - name: ZIGBEE2MQTT_CONFIG_MQTT_USER
              value: zigbee2mqtt
            - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: ZIGBEE2MQTT_PASSWORD
            - name: ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED
              value: "true"
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED
              value: "true"
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: zigbee2mqtt
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data

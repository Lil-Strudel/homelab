apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- postgres-backup-secret.sops.yaml
- postgres-objectstore.yaml
- postgres-cluster.yaml
- postgres-scheduled-backup.yaml
- postgres-scrape.yaml
- postgres-network-policy.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- network-policy.yaml
configMapGenerator:
- name: home-assistant
  namespace: home-automation
  files:
  - configuration.yaml

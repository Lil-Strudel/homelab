apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: home-assistant-backup
  namespace: home-automation
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://homelab-backups-827aa035/cnpg/home-assistant
    s3Credentials:
      accessKeyId:
        name: home-assistant-pg-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: home-assistant-pg-backup
        key: ACCESS_SECRET_KEY
      region:
        name: home-assistant-pg-backup
        key: AWS_REGION
    wal:
      compression: gzip
    data:
      compression: gzip

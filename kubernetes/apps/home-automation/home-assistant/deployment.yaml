apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
      labels:
        app: home-assistant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # configuration.yaml includes these, and Home Assistant only creates them when it
        # writes its own default configuration.yaml — which it never does here.
        - name: include-files
          image: ghcr.io/home-operations/home-assistant:2026.11.0
          command: ["touch", "/config/automations.yaml", "/config/scripts.yaml", "/config/scenes.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-operations/home-assistant:2026.11.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: TZ
              value: America/Denver
            - name: HA_RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: home-assistant-pg-app
                  key: uri
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
          startupProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazarr
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.56"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - bazarr.lilstrudel.io
      secretName: bazarr-tls
  rules:
    - host: bazarr.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bazarr
                port:
                  number: 6767

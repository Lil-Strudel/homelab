apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabnzbd
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.58"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - sabnzbd.lilstrudel.io
      secretName: sabnzbd-tls
  rules:
    - host: sabnzbd.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sabnzbd
                port:
                  number: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
      labels:
        app: sabnzbd
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: layout
          image: ghcr.io/home-operations/sabnzbd:5.1.3
          command: ["/bin/sh", "/layout/layout.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: layout
              mountPath: /layout
      containers:
        - name: sabnzbd
          image: ghcr.io/home-operations/sabnzbd:5.1.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Denver
            - name: SABNZBD__HOST_WHITELIST_ENTRIES
              value: sabnzbd, sabnzbd.media, sabnzbd.media.svc, sabnzbd.media.svc.cluster.local, sabnzbd.lilstrudel.io
            - name: SABNZBD__API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-api-keys
                  key: SABNZBD_API_KEY
            - name: SABNZBD__NZB_KEY
              valueFrom:
                secretKeyRef:
                  name: media-api-keys
                  key: SABNZBD_NZB_KEY
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data/usenet
              subPath: usenet
          readinessProbe:
            httpGet:
              path: /api?mode=version
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api?mode=version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: layout
          configMap:
            name: media-layout

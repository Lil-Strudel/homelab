apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoko
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shoko
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
      labels:
        app: shoko
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shoko
          image: ghcr.io/shokoanime/server:v5.3.3
          # The image's entrypoint needs root for usermod, chown and gosu. Exit code 140 is
          # Shoko asking for a restart, which the kubelet does anyway.
          command: ["/bin/sh", "-c", "mkdir -p \"$SHOKO_HOME\" && exec /usr/src/app/build/Shoko.CLI --restart-enabled"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8111
          env:
            - name: TZ
              value: America/Denver
            - name: HOME
              value: /tmp
            - name: SHOKO_HOME
              value: /home/shoko/.shoko/Shoko.CLI
          volumeMounts:
            - name: config
              mountPath: /home/shoko/.shoko
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shoko-config
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: media-data

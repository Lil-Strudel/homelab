apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shoko
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.52"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - shoko.lilstrudel.io
      secretName: shoko-tls
  rules:
    - host: shoko.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shoko
                port:
                  number: 8111

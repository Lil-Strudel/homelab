apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellystat
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: jellystat
  ingress:
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: jellystat-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The version check.
    - toFQDNs:
        - matchName: "api.github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

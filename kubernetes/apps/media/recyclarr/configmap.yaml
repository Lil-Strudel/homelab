apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr
  namespace: media
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    sonarr:
      sonarr:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY
        quality_definition:
          type: anime # series' Bluray-1080p floor of 50 MB/min would reject small anime encodes
        media_naming:
          series: jellyfin-tvdb
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
            name: 1080p
            reset_unmatched_scores:
              enabled: true
          - trash_id: 911df0e05a395c19d8b3efc76a7467c1 # Remux 2160p (Combined)
            name: Max
            reset_unmatched_scores:
              enabled: true
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            name: Anime Max
            reset_unmatched_scores:
              enabled: true
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f
            name: Anime 1080p
            reset_unmatched_scores:
              enabled: true
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities: [HDTV-1080p, WEBRip-1080p, WEBDL-1080p]
              - name: Bluray-720p
              - name: WEB 720p
                qualities: [HDTV-720p, WEBRip-720p, WEBDL-720p]
              - name: Bluray-480p
              - name: WEB 480p
                qualities: [WEBRip-480p, WEBDL-480p]
              - name: DVD
              - name: SDTV

    radarr:
      radarr:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: movie
        media_naming:
          folder: jellyfin-tmdb
          movie:
            rename: true
            standard: jellyfin-tmdb
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
            name: 1080p
            reset_unmatched_scores:
              enabled: true
          - trash_id: d1d310673359205736b4b84acd5ea8c8 # Remux 2160p (Combined)
            name: Max
            reset_unmatched_scores:
              enabled: true
          - trash_id: 722b624f9af1e492284c4bc842153a38 # [Anime] Remux-1080p
            name: Anime Max
            reset_unmatched_scores:
              enabled: true
          - trash_id: 722b624f9af1e492284c4bc842153a38
            name: Anime 1080p
            reset_unmatched_scores:
              enabled: true
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities: [HDTV-1080p, WEBRip-1080p, WEBDL-1080p]
              - name: Bluray-720p
              - name: WEB 720p
                qualities: [HDTV-720p, WEBRip-720p, WEBDL-720p]
              - name: Bluray-576p
              - name: Bluray-480p
              - name: WEB 480p
                qualities: [WEBRip-480p, WEBDL-480p]
              - name: DVD
              - name: SDTV

apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbit-manage
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbit-manage
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
      labels:
        app: qbit-manage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: layout
          image: ghcr.io/stuffanthings/qbit_manage:v4.13.0
          command: ["/bin/sh", "/layout/layout.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: layout
              mountPath: /layout
      containers:
        - name: qbit-manage
          image: ghcr.io/stuffanthings/qbit_manage:v4.13.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8181
          env:
            - name: TZ
              value: America/Denver
            - name: QBT_WEB_SERVER
              value: "true"
            - name: QBT_PORT
              value: "8181"
            - name: QBT_SCHEDULE
              value: "30"
            - name: QBT_CAT_UPDATE
              value: "true"
            - name: QBT_TAG_UPDATE
              value: "true"
            - name: QBT_REM_UNREGISTERED
              value: "true"
            - name: QBT_REM_ORPHANED
              value: "true"
            - name: QBT_TAG_NOHARDLINKS
              value: "true"
            - name: QBT_SHARE_LIMITS
              value: "true"
            - name: QBT_DRY_RUN
              value: "true" # it deletes files; review a few runs' logs before turning this off
            - name: QBT_SKIP_QB_VERSION_CHECK
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data/torrents
              subPath: torrents
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbit-manage-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: layout
          configMap:
            name: media-layout

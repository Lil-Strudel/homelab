apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbit-manage
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.65"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - qbit-manage.lilstrudel.io
      secretName: qbit-manage-tls
  rules:
    - host: qbit-manage.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbit-manage
                port:
                  number: 8181

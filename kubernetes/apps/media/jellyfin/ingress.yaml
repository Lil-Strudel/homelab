apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.50"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - jellyfin.lilstrudel.io
      secretName: jellyfin-tls
  rules:
    - host: jellyfin.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096

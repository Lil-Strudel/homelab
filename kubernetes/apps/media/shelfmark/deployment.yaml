apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shelfmark
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
      labels:
        app: shelfmark
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.7.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: TZ
              value: America/Denver
            - name: INGEST_DIR
              value: /data/media/books
            - name: FILE_ORGANIZATION
              value: organize
            - name: TEMPLATE_ORGANIZE
              value: "{Author}/{Series/}{Title} ({Year})"
            - name: DESTINATION_AUDIOBOOK
              value: /data/media/audiobooks
            - name: FILE_ORGANIZATION_AUDIOBOOK
              value: organize
            - name: TEMPLATE_AUDIOBOOK_ORGANIZE
              value: "{Author}/{Series/}{Title}/{Title}{ - Part }{PartNumber}"
            - name: HARDLINK_TORRENTS
              value: "true"
            - name: HARDLINK_TORRENTS_AUDIOBOOK
              value: "true"
            - name: USING_EXTERNAL_BYPASSER
              value: "false"
            - name: AUDIOBOOK_LIBRARY_URL
              value: https://audiobookshelf.lilstrudel.io
            - name: SHELFMARK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-api-keys
                  key: SHELFMARK_API_KEY
            - name: DIRECT_DOWNLOAD_ENABLED
              value: "true"
            - name: SUPPORTED_FORMATS
              value: epub
            - name: AA_MIRROR_URLS
              value: https://annas-archive.gl
            - name: AA_DONATOR_KEY
              valueFrom:
                secretKeyRef:
                  name: media-api-keys
                  key: AA_DONATOR_KEY
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp/shelfmark
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 3Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shelfmark
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.61"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - shelfmark.lilstrudel.io
      secretName: shelfmark-tls
  rules:
    - host: shelfmark.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shelfmark
                port:
                  number: 8084

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.53"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - sonarr.lilstrudel.io
      secretName: sonarr-tls
  rules:
    - host: sonarr.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8989

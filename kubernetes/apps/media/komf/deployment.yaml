apiVersion: apps/v1
kind: Deployment
metadata:
  name: komf
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: komf
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
      labels:
        app: komf
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: komf
          image: docker.io/sndxr/komf:2.1.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: TZ
              value: America/Denver
            - name: KOMF_KAVITA_BASE_URI
              value: http://kavita:5000
            - name: KOMF_KAVITA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: komf
                  key: KOMF_KAVITA_API_KEY
          volumeMounts:
            - name: config
              mountPath: /config
            - name: application
              mountPath: /config/application.yml
              subPath: application.yml
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: komf-config
        - name: application
          configMap:
            name: komf

apiVersion: v1
kind: ConfigMap
metadata:
  name: komf
  namespace: media
data:
  application.yml: |
    komga:
      eventListener:
        enabled: false
    kavita:
      eventListener:
        enabled: true
      metadataUpdate:
        default:
          libraryType: MANGA
          updateModes: [API]
          aggregate: true
          seriesCovers: true
    database:
      file: /config/database.sqlite
    metadataProviders:
      defaultProviders:
        mangaUpdates:
          priority: 10
          enabled: true
        aniList:
          priority: 20
          enabled: true
        mangaDex:
          priority: 30
          enabled: true
        webtoons:
          priority: 40
          enabled: true

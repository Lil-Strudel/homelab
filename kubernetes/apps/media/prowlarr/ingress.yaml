apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.55"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - prowlarr.lilstrudel.io
      secretName: prowlarr-tls
  rules:
    - host: prowlarr.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696

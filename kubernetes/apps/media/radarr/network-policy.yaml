apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: radarr
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: radarr
  ingress:
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: [prowlarr, bazarr, seerr, recyclarr, cleanuparr]
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: sabnzbd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Metadata, update checks, and TMDB artwork.
    - toFQDNs:
        - matchName: "radarr.video"
        - matchPattern: "*.radarr.video"
        - matchPattern: "*.servarr.com"
        - matchName: "image.tmdb.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

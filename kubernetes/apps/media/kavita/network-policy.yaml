apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kavita
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: kavita
  ingress:
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: [komf]
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Version checks and stats.
    - toFQDNs:
        - matchName: "kavitareader.com"
        - matchPattern: "*.kavitareader.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kavita
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.59"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - kavita.lilstrudel.io
      secretName: kavita-tls
  rules:
    - host: kavita.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kavita
                port:
                  number: 5000

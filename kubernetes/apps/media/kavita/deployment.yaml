apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
      labels:
        app: kavita
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: layout
          image: ghcr.io/kareadita/kavita:0.9.1
          command: ["/bin/sh", "/layout/layout.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: layout
              mountPath: /layout
      containers:
        - name: kavita
          image: ghcr.io/kareadita/kavita:0.9.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: TZ
              value: America/Denver
          volumeMounts:
            - name: config
              mountPath: /kavita/config
            - name: data
              mountPath: /data/media
              subPath: media
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: layout
          configMap:
            name: media-layout

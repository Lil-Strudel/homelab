apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.57"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - qbittorrent.lilstrudel.io
      secretName: qbittorrent-tls
  rules:
    - host: qbittorrent.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080

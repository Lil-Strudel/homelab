apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    lbipam.cilium.io/ips: "10.69.65.60"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - audiobookshelf.lilstrudel.io
      secretName: audiobookshelf-tls
  rules:
    - host: audiobookshelf.lilstrudel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 13378

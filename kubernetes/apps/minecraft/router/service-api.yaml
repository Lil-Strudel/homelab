apiVersion: v1
kind: Service
metadata:
  name: mc-router-api
  namespace: minecraft
  labels:
    app.kubernetes.io/name: mc-router
    app.kubernetes.io/component: api
spec:
  # Kept off the LoadBalancer deliberately: this port serves /metrics alongside a mutating
  # POST /routes and DELETE /routes/{addr}.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mc-router
  ports:
    - name: api
      port: 8080
      targetPort: api

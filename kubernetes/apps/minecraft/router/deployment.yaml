apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  namespace: minecraft
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mc-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mc-router
    spec:
      serviceAccountName: mc-router
      automountServiceAccountToken: true # the only pod here that talks to the Kubernetes API
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mc-router
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc-router
          image: itzg/mc-router:1.46.4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --in-kube-cluster
            - --kube-namespace=minecraft
            - --auto-scale-up
            - --auto-scale-down
            - --auto-scale-down-after=10m
            - --auto-scale-asleep-motd=§7Asleep — §aconnect to wake it up
            - --auto-scale-loading-motd=§6Waking up… §7give it a moment
            - --metrics-backend=prometheus
            - --api-binding=:8080
            - --record-logins
          ports:
            - name: minecraft
              containerPort: 25565
            - name: api
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /routes
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /routes
              port: api
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi

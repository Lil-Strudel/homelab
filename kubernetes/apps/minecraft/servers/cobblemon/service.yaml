apiVersion: v1
kind: Service
metadata:
  name: mc
  namespace: minecraft
  annotations:
    mc-router.itzg.me/externalServerName: "cobblemon.mc.lilstrudel.io"
    # A measured first boot on an empty volume took ~14m: waiting for a node with 5Gi free,
    # then the modpack download, then world gen. Later wakes are ~1m.
    mc-router.itzg.me/autoScaleWaitTimeout: "20m"

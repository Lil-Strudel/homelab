apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mc
  namespace: minecraft
spec:
  template:
    spec:
      containers:
        - name: mc
          image: itzg/minecraft-server:2026.7.2-java21 # the pack targets MC 1.21.x, which Fabric runs on Java 21
          env:
            - name: TYPE
              value: MODRINTH
            - name: MODRINTH_MODPACK
              value: cobblemon-fabric
            - name: MODRINTH_VERSION
              value: "1.7.3"
            - name: MODRINTH_LOADER
              value: fabric
            - name: MEMORY
              value: 4G
            - name: MOTD
              value: "§6Cobblemon§r\n§7Gotta catch 'em all."
          startupProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          resources:
            requests:
              cpu: "1"
              memory: 5Gi
            limits:
              cpu: "4"
              memory: 6Gi
        - name: mc-backup
          env:
            - name: RESTIC_REPOSITORY
              value: "s3:s3.us-west-2.amazonaws.com/homelab-backups-827aa035/minecraft/cobblemon"

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: minecraft
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled # ceph-block reclaims on delete — a stray git rm would destroy the world
spec:
  storageClassName: ceph-block
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

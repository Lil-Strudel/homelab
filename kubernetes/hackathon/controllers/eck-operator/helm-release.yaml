apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
  namespace: elastic-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: eck-operator
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: elastic-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    managedNamespaces:
      - cnh

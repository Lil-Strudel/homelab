apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dash0-operator
  namespace: dash0-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: dash0-operator
      version: "0.159.0"
      sourceRef:
        kind: HelmRepository
        name: dash0-operator
        namespace: dash0-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    operator:
      clusterName: homelab
      dash0Export:
        enabled: true
        endpoint: ingress.us-west-2.aws.dash0.com:4317
        apiEndpoint: https://api.us-west-2.aws.dash0.com
        secretRef:
          name: dash0-authorization
          key: token
      agent0Connector:
        enabled: true
        serverAddress: REPLACE_WITH_DASH0_OUTBOUND_CONNECTOR_ENDPOINT
        secretRef:
          name: dash0-authorization
          key: token

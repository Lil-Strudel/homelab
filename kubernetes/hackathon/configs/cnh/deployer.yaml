apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: cnh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: cnh
rules:
  - apiGroups:
      - ""
      - apps
      - batch
      - policy
      - autoscaling
      - networking.k8s.io
      - keda.sh
      - elasticsearch.k8s.elastic.co
      - kibana.k8s.elastic.co
      - cilium.io
      - operator.dash0.com
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: cnh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: cnh

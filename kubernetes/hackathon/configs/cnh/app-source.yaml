apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: app
  namespace: cnh
spec:
  interval: 1m
  url: oci://ghcr.io/lil-strudel/2026-cn-hackathon/manifests
  ref:
    tag: main
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/Lil-Strudel/2026-cn-hackathon/\.github/workflows/ci\.yml@refs/heads/main$
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: cnh
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: app
  path: ./
  targetNamespace: cnh
  serviceAccountName: deployer
  prune: true
  wait: true

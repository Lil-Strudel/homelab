apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer-secureboot/f67be5bd8cfd1f3f484664ffe095d1b1dc7a28233afee3af14557a1aa062c40e:v1.14.2
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/md-name-talos:boot" in disk.symlinks'
---
apiVersion: v1alpha1
kind: RAIDArrayConfig
name: boot
level: raid1
metadata: "1.0"
provisioning:
  volumeSelector:
    match: disk.serial in ["S6PXNL0W611305E", "S6PXNL0W611303R"]
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: raid1
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs
---
apiVersion: v1alpha1
kind: HostnameConfig
auto:
  $patch: delete
hostname: rem-4

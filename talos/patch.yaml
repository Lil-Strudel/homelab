machine:
  install:
    image: factory.talos.dev/metal-installer-secureboot/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.13.9
    disk:
      $patch: delete # drop the base config's `disk:`; select by model instead so the OS never lands on the NVMe (Ceph data)
    diskSelector:
      model: Samsung SSD 870
cluster:
  network:
    cni:
      name: none # Cilium is the CNI — do NOT re-enable, it would double-install and break the network
  proxy:
    disabled: true # Cilium is the kube-proxy replacement — do NOT re-enable
